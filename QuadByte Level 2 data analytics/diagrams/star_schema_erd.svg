<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .tbl-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .tbl-col { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #1e293b; }
      .tbl-subhdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .key-pk { font-weight: 700; fill: #b91c1c; }
      .key-fk { font-weight: 700; fill: #2563eb; }
      .callout { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-3%" y="-5%" width="106%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#64748b" />
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="660" fill="#f8fafc" rx="8" />
  <rect x="16" y="16" width="968" height="628" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8" />

  <!-- Title -->
  <text x="500" y="48" class="title">Enterprise Analytical Star Schema Architecture (&quot;You Hungry&quot; OLAP)</text>
  <line x1="48" y1="62" x2="952" y2="62" stroke="#cbd5e1" stroke-width="1" />

  <!-- CENTER: FactOrders -->
  <g filter="url(#shadow)">
    <rect x="360" y="100" width="280" height="430" rx="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2.5" />
    <rect x="360" y="100" width="280" height="36" rx="8" fill="#dbeafe" />
    <text x="500" y="124" class="tbl-hdr" fill="#1e3a8a">FactOrders (Central Fact)</text>

    <!-- Keys -->
    <text x="376" y="156" class="tbl-col"><tspan class="key-pk">PK </tspan>order_key <tspan fill="#64748b">BIGINT</tspan></text>
    <line x1="370" y1="166" x2="630" y2="166" stroke="#e2e8f0" stroke-width="1" />

    <text x="376" y="184" class="tbl-col"><tspan class="key-fk">FK </tspan>date_key <tspan fill="#64748b">INT</tspan></text>
    <text x="376" y="202" class="tbl-col"><tspan class="key-fk">FK </tspan>city_key <tspan fill="#64748b">INT</tspan></text>
    <text x="376" y="220" class="tbl-col"><tspan class="key-fk">FK </tspan>restaurant_key <tspan fill="#64748b">INT</tspan></text>
    <text x="376" y="238" class="tbl-col"><tspan class="key-fk">FK </tspan>customer_key <tspan fill="#64748b">INT</tspan></text>
    <text x="376" y="256" class="tbl-col"><tspan class="key-fk">FK </tspan>rider_key <tspan fill="#64748b">INT</tspan></text>

    <!-- Degenerate Dimension -->
    <rect x="372" y="270" width="256" height="20" rx="4" fill="#f1f5f9" />
    <text x="500" y="284" class="tbl-subhdr" fill="#475569" text-anchor="middle">— Degenerate Dimension —</text>
    <text x="376" y="306" class="tbl-col">   order_id <tspan fill="#64748b">INT (Source OLTP PK)</tspan></text>

    <!-- Additive Measures -->
    <rect x="372" y="322" width="256" height="20" rx="4" fill="#f1f5f9" />
    <text x="500" y="336" class="tbl-subhdr" fill="#475569" text-anchor="middle">— Additive Measures —</text>
    <text x="376" y="358" class="tbl-col">   order_amount <tspan fill="#64748b">NUMERIC(10,2)</tspan></text>
    <text x="376" y="378" class="tbl-col">   discount_amount <tspan fill="#64748b">NUMERIC(10,2)</tspan></text>
    <text x="376" y="398" class="tbl-col">   delivery_fee <tspan fill="#64748b">NUMERIC(10,2)</tspan></text>
    <text x="376" y="418" class="tbl-col">   tip_amount <tspan fill="#64748b">NUMERIC(10,2)</tspan></text>
    <text x="376" y="438" class="tbl-col">   delivery_time_mins <tspan fill="#64748b">NUMERIC(6,2)</tspan></text>
    <text x="376" y="458" class="tbl-col">   is_delivered <tspan fill="#64748b">BOOLEAN</tspan></text>
    <text x="376" y="478" class="tbl-col">   is_cancelled <tspan fill="#64748b">BOOLEAN</tspan></text>
    <text x="376" y="498" class="tbl-col">   rating_score <tspan fill="#64748b">NUMERIC(2,1)</tspan></text>
  </g>

  <!-- TOP-LEFT: DimCity -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="250" height="180" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="2" />
    <rect x="40" y="90" width="250" height="34" rx="8" fill="#d1fae5" />
    <text x="165" y="113" class="tbl-hdr" fill="#065f46">DimCity</text>
    
    <text x="56" y="145" class="tbl-col"><tspan class="key-pk">PK </tspan>city_key <tspan fill="#64748b">INT</tspan></text>
    <line x1="50" y1="155" x2="280" y2="155" stroke="#e2e8f0" stroke-width="1" />
    <text x="56" y="174" class="tbl-col">   city_id <tspan fill="#64748b">INT</tspan></text>
    <text x="56" y="194" class="tbl-col">   city_name <tspan fill="#64748b">VARCHAR(50)</tspan></text>
    <text x="56" y="214" class="tbl-col">   province <tspan fill="#64748b">VARCHAR(50)</tspan></text>
    <text x="56" y="234" class="tbl-col">   delivery_tier <tspan fill="#64748b">VARCHAR(20)</tspan></text>
    <text x="56" y="254" class="tbl-col">   is_active <tspan fill="#64748b">BOOLEAN</tspan></text>
  </g>

  <!-- TOP-RIGHT: DimDate -->
  <g filter="url(#shadow)">
    <rect x="710" y="90" width="250" height="195" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="2" />
    <rect x="710" y="90" width="250" height="34" rx="8" fill="#ede9fe" />
    <text x="835" y="113" class="tbl-hdr" fill="#6d28d9">DimDate</text>
    
    <text x="726" y="145" class="tbl-col"><tspan class="key-pk">PK </tspan>date_key <tspan fill="#64748b">INT (YYYYMMDD)</tspan></text>
    <line x1="720" y1="155" x2="950" y2="155" stroke="#e2e8f0" stroke-width="1" />
    <text x="726" y="174" class="tbl-col">   full_date <tspan fill="#64748b">DATE</tspan></text>
    <text x="726" y="194" class="tbl-col">   day_name <tspan fill="#64748b">VARCHAR(15)</tspan></text>
    <text x="726" y="214" class="tbl-col">   month_name <tspan fill="#64748b">VARCHAR(15)</tspan></text>
    <text x="726" y="234" class="tbl-col">   quarter <tspan fill="#64748b">INT</tspan>, year <tspan fill="#64748b">INT</tspan></text>
    <text x="726" y="254" class="tbl-col">   is_weekend <tspan fill="#64748b">BOOLEAN</tspan></text>
    <text x="726" y="274" class="tbl-col">   is_ramadan_eid <tspan fill="#64748b">BOOLEAN</tspan></text>
  </g>

  <!-- BOTTOM-LEFT: DimRestaurant -->
  <g filter="url(#shadow)">
    <rect x="40" y="340" width="250" height="190" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="2" />
    <rect x="40" y="340" width="250" height="34" rx="8" fill="#fef3c7" />
    <text x="165" y="363" class="tbl-hdr" fill="#92400e">DimRestaurant</text>
    
    <text x="56" y="395" class="tbl-col"><tspan class="key-pk">PK </tspan>restaurant_key <tspan fill="#64748b">INT</tspan></text>
    <line x1="50" y1="405" x2="280" y2="405" stroke="#e2e8f0" stroke-width="1" />
    <text x="56" y="424" class="tbl-col">   restaurant_id <tspan fill="#64748b">INT</tspan></text>
    <text x="56" y="444" class="tbl-col">   name <tspan fill="#64748b">VARCHAR(100)</tspan></text>
    <text x="56" y="464" class="tbl-col">   cuisine_type <tspan fill="#64748b">VARCHAR(50)</tspan></text>
    <text x="56" y="484" class="tbl-col">   city_name <tspan fill="#64748b">VARCHAR(50)</tspan></text>
    <text x="56" y="504" class="tbl-col">   rating_tier <tspan fill="#64748b">VARCHAR(20)</tspan></text>
  </g>

  <!-- BOTTOM-RIGHT: DimCustomer -->
  <g filter="url(#shadow)">
    <rect x="710" y="340" width="250" height="190" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2" />
    <rect x="710" y="340" width="250" height="34" rx="8" fill="#dbeafe" />
    <text x="835" y="363" class="tbl-hdr" fill="#1e40af">DimCustomer</text>
    
    <text x="726" y="395" class="tbl-col"><tspan class="key-pk">PK </tspan>customer_key <tspan fill="#64748b">INT</tspan></text>
    <line x1="720" y1="405" x2="950" y2="405" stroke="#e2e8f0" stroke-width="1" />
    <text x="726" y="424" class="tbl-col">   customer_id <tspan fill="#64748b">INT</tspan></text>
    <text x="726" y="444" class="tbl-col">   name <tspan fill="#64748b">VARCHAR(100)</tspan></text>
    <text x="726" y="464" class="tbl-col">   signup_date <tspan fill="#64748b">DATE</tspan></text>
    <text x="726" y="484" class="tbl-col">   city_name <tspan fill="#64748b">VARCHAR(50)</tspan></text>
    <text x="726" y="504" class="tbl-col">   spending_tier <tspan fill="#64748b">VARCHAR(20)</tspan></text>
  </g>

  <!-- CONNECTING ARROWS -->
  <!-- DimCity -> FactOrders -->
  <path d="M 290 180 L 360 202" stroke="#059669" stroke-width="2" fill="none" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="325" y="184" font-family="-apple-system, sans-serif" font-size="10px" font-weight="bold" fill="#059669">1:N</text>

  <!-- DimDate -> FactOrders -->
  <path d="M 710 180 L 640 184" stroke="#7c3aed" stroke-width="2" fill="none" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="675" y="174" font-family="-apple-system, sans-serif" font-size="10px" font-weight="bold" fill="#7c3aed">1:N</text>

  <!-- DimRestaurant -> FactOrders -->
  <path d="M 290 420 L 360 220" stroke="#d97706" stroke-width="2" fill="none" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="325" y="325" font-family="-apple-system, sans-serif" font-size="10px" font-weight="bold" fill="#d97706">1:N</text>

  <!-- DimCustomer -> FactOrders -->
  <path d="M 710 420 L 640 238" stroke="#2563eb" stroke-width="2" fill="none" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="675" y="325" font-family="-apple-system, sans-serif" font-size="10px" font-weight="bold" fill="#2563eb">1:N</text>

  <!-- FOOTER CALLOUT -->
  <g filter="url(#shadow)">
    <rect x="40" y="560" width="920" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="500" y="584" class="callout" font-weight="700">Executive Query: &quot;Orders per city per month for last 2 years&quot; executes in &lt; 45ms via integer surrogate key joins.</text>
    <text x="500" y="604" class="callout" fill="#475569">Complete Isolation: OLAP warehouse analytics queries never lock or degrade live production OLTP transaction checkouts.</text>
  </g>
</svg>
