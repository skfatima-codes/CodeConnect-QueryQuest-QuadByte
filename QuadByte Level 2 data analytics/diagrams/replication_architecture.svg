<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .box-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-3%" y="-5%" width="106%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="#f8fafc" rx="8" />
  <rect x="16" y="16" width="968" height="548" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8" />

  <!-- Title -->
  <text x="500" y="48" class="title">PostgreSQL Master-Replica Replication Topology (80% Read / 20% Write)</text>
  <line x1="48" y1="62" x2="952" y2="62" stroke="#cbd5e1" stroke-width="1" />

  <!-- 1. Client Layer -->
  <g filter="url(#shadow)">
    <rect x="40" y="160" width="200" height="240" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5" />
    <rect x="40" y="160" width="200" height="36" rx="8" fill="#e2e8f0" />
    <text x="140" y="184" class="box-hdr" fill="#1e293b">Client Layer</text>
    
    <text x="140" y="222" class="box-sub">• Web Ordering App</text>
    <text x="140" y="246" class="box-sub">• Mobile App (iOS / Android)</text>
    <text x="140" y="270" class="box-sub">• Rider Logistics App</text>
    <text x="140" y="294" class="box-sub">• Merchant Portal</text>
    
    <rect x="56" y="325" width="168" height="54" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
    <text x="140" y="347" class="tag-text" fill="#b45309">10x Ramadan Spike</text>
    <text x="140" y="365" font-family="-apple-system, sans-serif" font-size="10px" fill="#92400e" text-anchor="middle">500,000 orders/day</text>
  </g>

  <!-- Flow Client -> Proxy -->
  <path d="M 240 280 L 320 280" stroke="#1e293b" stroke-width="2" marker-end="url(#arrDark)" marker-start="url(#arrDark)" />

  <!-- 2. Routing & Proxy Layer -->
  <g filter="url(#shadow)">
    <rect x="320" y="140" width="230" height="280" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <rect x="320" y="140" width="230" height="38" rx="8" fill="#dbeafe" />
    <text x="435" y="165" class="box-hdr" fill="#1e40af">Routing &amp; Proxy Layer</text>

    <text x="435" y="202" class="box-hdr" fill="#2563eb" font-size="13px">HAProxy + PgBouncer</text>
    <text x="435" y="224" class="box-sub" font-size="11px">Connection Pooling &amp; Decoupling</text>

    <rect x="338" y="244" width="194" height="64" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="435" y="266" class="tag-text" fill="#1e3a8a">Read-Your-Writes Router</text>
    <text x="435" y="284" font-family="-apple-system, sans-serif" font-size="10.5px" fill="#475569" text-anchor="middle">Pins reads for 5s after write</text>
    <text x="435" y="299" font-family="-apple-system, sans-serif" font-size="10px" fill="#64748b" text-anchor="middle">Eliminates replication lag race</text>

    <text x="435" y="340" class="flow-label" fill="#dc2626">Port 5432 ➔ Primary (Writes)</text>
    <text x="435" y="362" class="flow-label" fill="#059669">Port 5433 ➔ Replicas (Reads)</text>
    <text x="435" y="394" class="box-sub" font-size="10px" font-style="italic">Dynamic Health Checks: 2000ms</text>
  </g>

  <!-- Arrows from Proxy to Primary and Replicas -->
  <!-- To Primary (Writes) -->
  <path d="M 550 210 L 640 145" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#arrRed)" />
  <rect x="562" y="152" width="76" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
  <text x="600" y="167" class="flow-label" fill="#991b1b" font-size="10px">Writes (20%)</text>

  <!-- To Replicas (Reads) -->
  <path d="M 550 310 L 640 310" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)" />
  <rect x="562" y="288" width="76" height="22" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1" />
  <text x="600" y="303" class="flow-label" fill="#065f46" font-size="10px">Reads (80%)</text>

  <!-- 3. Primary Database -->
  <g filter="url(#shadow)">
    <rect x="650" y="90" width="310" height="115" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" />
    <rect x="650" y="90" width="310" height="32" rx="8" fill="#fee2e2" />
    <text x="805" y="112" class="box-hdr" fill="#991b1b">Primary PostgreSQL Node (Writer)</text>
    <text x="805" y="140" class="tag-text" fill="#b91c1c">20% Traffic: INSERT / UPDATE / FOR UPDATE</text>
    <text x="805" y="160" class="box-sub">ACID Transactions • Order Transitions • Financial Ledger</text>
    <text x="805" y="180" class="box-sub" font-size="10.5px">Master WAL Sequence: pg_current_wal_lsn()</text>
  </g>

  <!-- WAL Streaming Replication Arrows -->
  <path d="M 805 205 L 805 245" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrBlue)" />
  <text x="860" y="228" font-family="-apple-system, sans-serif" font-size="11px" font-weight="600" fill="#2563eb">Async WAL Streaming</text>

  <!-- 4. Read Replicas (Active Readers) -->
  <g filter="url(#shadow)">
    <rect x="650" y="250" width="310" height="120" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
    <rect x="650" y="250" width="310" height="32" rx="8" fill="#d1fae5" />
    <text x="805" y="272" class="box-hdr" fill="#065f46">Read Replica 1 &amp; 2 (Active Readers)</text>
    <text x="805" y="302" class="tag-text" fill="#047857">80% Traffic: Menus, Catalog Search, Reviews</text>
    <text x="805" y="322" class="box-sub">Round-Robin Load Balanced via PgBouncer Pool</text>
    <text x="805" y="342" class="box-sub" font-size="10.5px">Auto-Scales from 2 to 6 Nodes During Ramadan Peaks</text>
  </g>

  <!-- WAL Streaming to Standby -->
  <path d="M 805 370 L 805 400" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arrBlue)" />

  <!-- 5. Standby Node -->
  <g filter="url(#shadow)">
    <rect x="650" y="405" width="310" height="95" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <rect x="650" y="405" width="310" height="30" rx="8" fill="#f1f5f9" />
    <text x="805" y="426" class="box-hdr" fill="#334155">Replica 3 / Hot Standby Node</text>
    <text x="805" y="455" class="box-sub" font-weight="600" fill="#475569">Automated Patroni / Raft Failover Target</text>
    <text x="805" y="475" class="box-sub">Isolated Heavy Reporting &amp; Analytical Backup Scans</text>
  </g>

  <!-- Footer Banner -->
  <g filter="url(#shadow)">
    <rect x="40" y="520" width="920" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="500" y="544" class="box-sub" font-weight="600" fill="#334155">High Availability SLA: 99.99% • Recovery Point Objective (RPO) &lt; 1s • Recovery Time Objective (RTO) &lt; 30s</text>
  </g>
</svg>
