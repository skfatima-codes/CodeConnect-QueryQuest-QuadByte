<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .pillar-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .cluster-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .cluster-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #334155; }
      .cluster-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-style: italic; font-weight: 600; }
      .callout { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-3%" y="-5%" width="106%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafc" rx="8" />
  <rect x="16" y="16" width="928" height="568" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8" />

  <!-- Title -->
  <text x="480" y="48" class="title">CAP &amp; PACELC Theorem Operational Matrix (&quot;You Hungry&quot; Platform)</text>
  <line x1="48" y1="62" x2="912" y2="62" stroke="#cbd5e1" stroke-width="1" />

  <!-- Dashed Central Triangle -->
  <polygon points="480,110 160,420 800,420" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Triangle Vertices -->
  <!-- Top: Consistency (C) -->
  <g filter="url(#shadow)">
    <rect x="375" y="80" width="210" height="48" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2" />
    <text x="480" y="110" class="pillar-title" fill="#1e3a8a">Consistency (C)</text>
  </g>

  <!-- Bottom-Left: Availability (A) -->
  <g filter="url(#shadow)">
    <rect x="55" y="405" width="210" height="48" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2" />
    <text x="160" y="435" class="pillar-title" fill="#047857">Availability (A)</text>
  </g>

  <!-- Bottom-Right: Partition Tolerance (P) -->
  <g filter="url(#shadow)">
    <rect x="695" y="405" width="210" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
    <text x="800" y="435" class="pillar-title" fill="#7c3aed">Partition Tolerance (P)</text>
  </g>

  <!-- AP CLUSTER BOX (Left side, between A and P) -->
  <g filter="url(#shadow)">
    <rect x="60" y="195" width="350" height="175" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
    <rect x="60" y="195" width="350" height="34" rx="8" fill="#ccfbf1" />
    <text x="80" y="218" class="cluster-title" fill="#0f766e">AP CLUSTER — High Availability Workloads</text>
    
    <text x="80" y="250" class="cluster-item">• <tspan font-weight="bold">Real-time Rider GPS Tracking</tspan> (3s telemetry frequency)</text>
    <text x="80" y="272" class="cluster-item">• <tspan font-weight="bold">Restaurant &amp; Menu Catalog Browsing</tspan> (Cached catalog)</text>
    <text x="80" y="294" class="cluster-item">• <tspan font-weight="bold">Customer Review Feeds &amp; Ratings</tspan> (Eventual consistency)</text>

    <line x1="80" y1="310" x2="390" y2="310" stroke="#99f6e4" stroke-width="1" />
    <text x="80" y="332" class="cluster-note" fill="#0f766e">Under Network Partition: Serve stale read cache</text>
    <text x="80" y="348" font-family="-apple-system, sans-serif" font-size="10.5px" fill="#115e59">Prioritize uptime; zero customer 500 errors during browsing.</text>
  </g>

  <!-- CP CLUSTER BOX (Right side, between C and P) -->
  <g filter="url(#shadow)">
    <rect x="550" y="195" width="350" height="175" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <rect x="550" y="195" width="350" height="34" rx="8" fill="#fee2e2" />
    <text x="570" y="218" class="cluster-title" fill="#991b1b">CP CLUSTER — Strict Consistency Workloads</text>
    
    <text x="570" y="250" class="cluster-item">• <tspan font-weight="bold">Order Placement &amp; Checkout</tspan> (State machine transitions)</text>
    <text x="570" y="272" class="cluster-item">• <tspan font-weight="bold">Payment Processing &amp; Wallet Ledger</tspan> (Two-phase commit)</text>
    <text x="570" y="294" class="cluster-item">• <tspan font-weight="bold">Rider Order Claim</tspan> (Row-level lock: SELECT FOR UPDATE)</text>

    <line x1="570" y1="310" x2="880" y2="310" stroke="#fecaca" stroke-width="1" />
    <text x="570" y="332" class="cluster-note" fill="#b91c1c">Under Network Partition: Block or reject split writes</text>
    <text x="570" y="348" font-family="-apple-system, sans-serif" font-size="10.5px" fill="#7f1d1d">Prevent double-charging, lost updates, or split-brain orders.</text>
  </g>

  <!-- Bottom Middle Warning Badge: CA Impossible in Distributed Systems -->
  <g filter="url(#shadow)">
    <rect x="360" y="445" width="240" height="34" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" />
    <text x="480" y="467" font-family="-apple-system, sans-serif" font-size="11px" font-weight="700" fill="#b45309" text-anchor="middle">CA systems cannot exist across networks</text>
  </g>

  <!-- Bottom Explanatory Callout Box -->
  <g filter="url(#shadow)">
    <rect x="60" y="500" width="840" height="66" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="480" y="524" class="callout" font-weight="700">Fundamental Law: Network partitions (P) are an unavoidable physical reality in distributed infrastructure.</text>
    <text x="480" y="546" class="callout" fill="#475569">When nodes disconnect, systems MUST choose: (1) Accept writes and sacrifice Consistency (AP), or (2) Reject writes to preserve Consistency (CP).</text>
  </g>
</svg>
